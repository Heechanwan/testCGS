name: Deploy Vite App to GitHub Pages

on:
  push:
    # Запускаем деплой только при пуше в ветку 'main'
    branches:
      - main
  # Это позволяет вручную запустить деплой из вкладки Actions
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Обновленная версия

      - name: Setup Node.js
        # Рекомендуется использовать актуальную LTS-версию
        uses: actions/setup-node@v4 
        with:
          node-version: '20' 
          cache: 'npm' # Кэшируем зависимости для ускорения

      - name: Install Dependencies
        run: npm install

      - name: Build Project (with Vite)
        # 🌟 КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: ДОБАВЛЯЕМ СЕКРЕТЫ FIREBASE В ПРОЦЕСС СБОРКИ 🌟
        env:
          # УБЕДИТЕСЬ, ЧТО ИМЕНА СЕКРЕТОВ (ПОСЛЕ secrets.) СОВПАДАЮТ
          # С ТЕМИ, КОТОРЫЕ ВЫ ДОБАВИЛИ В НАСТРОЙКАХ РЕПОЗИТОРИЯ!
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist
          # Указываем срок хранения артефакта
          retention-days: 1 

  deploy:
    name: Deploy to GitHub Pages
    # Зависит от успешного выполнения 'build'
    needs: build
    runs-on: ubuntu-latest
    # Деплоим только если пуш был в ветку 'main'
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        # 🌟 Используем актуальную версию v4
        uses: peaceiris/actions-gh-pages@v4 
        with:
          # Встроенный токен для авторизации деплоя
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          # Папка, которую нужно опубликовать
          publish_dir: ./dist