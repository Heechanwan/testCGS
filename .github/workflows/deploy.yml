name: Deploy Vite App to GitHub Pages

on:
  push:
    # Запускаем деплой только при пуше в ветку 'main'
    branches:
      - main
  # Это позволяет вручную запустить деплой из вкладки Actions
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '20' 
          cache: 'npm' # Кэшируем зависимости для ускорения

      - name: Install Dependencies
        run: npm install

      - name: Build Project (with Vite)
        # 🌟 КЛЮЧЕВОЕ ОБНОВЛЕНИЕ: БЛОК 'env' УДАЛЕН. 🌟
        # Поскольку секреты названы VITE_*, GitHub Actions АВТОМАТИЧЕСКИ
        # передает их в процесс 'npm run build' (Vite).
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist
          retention-days: 1 

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          publish_dir: ./dist